        // 감정 차트 업데이트
        function updateEmotionChart(emotionScores) {
            if (!emotionChart) return;
            
            chatCount++;
            
            // 감정 점수 데이터 추가 (0.0~1.0 범위 그대로 사용)
            emotionData.joy.push(emotionScores.joy || 0);
            emotionData.sadness.push(emotionScores.sadness || 0);
            emotionData.anger.push(emotionScores.anger || 0);
            emotionData.anxiety.push(emotionScores.anxiety || 0);
            emotionData.apathy.push(emotionScores.apathy || 0);
            emotionData.neutral.push(emotionScores.neutral || 0);
            
            // 최대 20개 데이터 포인트만 유지 (슬라이딩 윈도우)
            const maxDataPoints = 20;
            if (emotionData.joy.length > maxDataPoints) {
                emotionData.joy.shift();
                emotionData.sadness.shift();
                emotionData.anger.shift();
                emotionData.anxiety.shift();
                emotionData.apathy.shift();
                emotionData.neutral.shift();
            }
            
            // 차트 데이터 업데이트
            const labels = [];
            for (let i = 0; i < emotionData.joy.length; i++) {
                labels.push(`#${chatCount - emotionData.joy.length + i + 1}`);
            }
            
            emotionChart.data.labels = labels;
            emotionChart.data.datasets[0].data = emotionData.joy;
            emotionChart.data.datasets[1].data = emotionData.sadness;
            emotionChart.data.datasets[2].data = emotionData.anger;
            emotionChart.data.datasets[3].data = emotionData.anxiety;
            emotionChart.data.datasets[4].data = emotionData.apathy;
            emotionChart.data.datasets[5].data = emotionData.neutral;
            
            // 차트 업데이트
            emotionChart.update('active');
            
            console.log('감정 차트 업데이트:', {
                chatCount: chatCount,
                dataPoints: emotionData.joy.length,
                emotions: emotionScores
            });
        }

        // 서버 감정 데이터를 6가지 감정 점수로 변환
        function convertEmotionToScores(emotionData) {
            const emotionClass = emotionData.emotion_class || emotionData.class || '중립';
            const emotionScore = emotionData.emotion_score || emotionData.score || 0.0;
            
            console.log('감정 데이터 변환:', { emotionClass, emotionScore });
            
            // 기본값: 모든 감정을 0으로 초기화
            const scores = {
                joy: 0.0,
                sadness: 0.0,
                anger: 0.0,
                anxiety: 0.0,
                apathy: 0.0,
                neutral: 0.0
            };
            
            // 감정 분류에 따라 해당 감정에 점수 할당
            switch (emotionClass) {
                case '기쁨':
                    scores.joy = emotionScore;
                    break;
                case '슬픔':
                    scores.sadness = emotionScore;
                    break;
                case '분노':
                    scores.anger = emotionScore;
                    break;
                case '불안':
                    scores.anxiety = emotionScore;
                    break;
                case '무기력':
                    scores.apathy = emotionScore;
                    break;
                case '중립':
                    scores.neutral = emotionScore;
                    break;
                default:
                    scores.neutral = emotionScore;
            }
            
            console.log('변환된 감정 점수:', scores);
            return scores;
        }

        // 샘플 감정 데이터 생성 (테스트용)
        function generateSampleEmotionData() {
            return {
                joy: Math.random(), // 0.0~1.0
                sadness: Math.random(),
                anger: Math.random(),
                anxiety: Math.random(),
                apathy: Math.random(),
                neutral: Math.random()
            };
        }

        // 오른쪽 사이드바 리사이즈 기능
        function initRightSidebarResize() {
            const rightSidebar = document.getElementById('rightSidebar');
            const rightResizeHandle = document.getElementById('rightResizeHandle');
            const chatContainer = document.querySelector('.chat-container');
            const leftSidebar = document.getElementById('leftSidebar');
            let isResizing = false;

            rightResizeHandle.addEventListener('mousedown', (e) => {
                isResizing = true;
                
                // 드래그 중 커서 스타일 변경
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';
                
                document.addEventListener('mousemove', handleResize);
                document.addEventListener('mouseup', stopResize);
                
                e.preventDefault();
            });

            function handleResize(e) {
                if (!isResizing) return;
                
                // 화면 오른쪽 끝에서 마우스 위치까지의 거리로 사이드바 너비 계산
                const windowWidth = window.innerWidth;
                const newRightWidth = windowWidth - e.clientX;
                
                const minWidth = 250;
                const maxWidth = 600;
                
                // 범위 내에서만 적용
                if (newRightWidth >= minWidth && newRightWidth <= maxWidth) {
                    // 오른쪽 사이드바 너비만 설정 (flex 레이아웃이 자동으로 채팅 영역 조절)
                    rightSidebar.style.width = newRightWidth + 'px';
                }
            }

            function stopResize() {
                isResizing = false;
                
                // 커서 스타일 복원
                document.body.style.cursor = '';
                document.body.style.userSelect = '';
                
                document.removeEventListener('mousemove', handleResize);
                document.removeEventListener('mouseup', stopResize);
            }
        }

        // 홈으로 이동 함수
        function goToHome() {
            window.location.href = '/';
        }

    </script>
</body>
