<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - AI 멀티에이전트 상담 시스템</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            /* Gooroomee-inspired Color Palette */
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #3b82f6;
            --primary-gradient: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            --secondary: #06b6d4;
            --secondary-light: #0891b2;
            --secondary-gradient: linear-gradient(135deg, #0891b2 0%, #06b6d4 100%);
            --accent: #f59e0b;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --info: #3b82f6;
            
            /* Gooroomee-style Backgrounds */
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-tertiary: #f1f5f9;
            --bg-gradient: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            --bg-hero: linear-gradient(135deg, #1e40af 0%, #3b82f6 50%, #06b6d4 100%);
            
            /* Neutral Colors */
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --gray-900: #111827;
            
            /* Spacing */
            --space-1: 0.25rem;
            --space-2: 0.5rem;
            --space-3: 0.75rem;
            --space-4: 1rem;
            --space-5: 1.25rem;
            --space-6: 1.5rem;
            --space-8: 2rem;
            --space-10: 2.5rem;
            --space-12: 3rem;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            font-weight: 400;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: var(--bg-hero);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            background: white;
            border-radius: 24px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            width: 100%;
            max-width: 480px;
            position: relative;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-header {
            background: var(--primary-gradient);
            padding: 48px 40px;
            text-align: center;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .auth-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M 10 0 L 0 0 0 10" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/></pattern></defs><rect width="100" height="100" fill="url(%23grid)"/></svg>');
            opacity: 0.3;
        }

        .auth-logo {
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .auth-logo img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            border-radius: 12px;
            filter: brightness(0) invert(1);
            transition: transform 0.3s ease;
        }

        .auth-logo img:hover {
            transform: scale(1.05);
        }

        .auth-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 12px;
            position: relative;
            z-index: 2;
        }

        .auth-subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
            position: relative;
            z-index: 2;
        }

        .auth-form {
            padding: 48px 40px;
        }

        .form-group {
            margin-bottom: 24px;
            position: relative;
        }

        .form-label {
            display: block;
            font-weight: 600;
            color: var(--gray-700);
            margin-bottom: 8px;
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        .form-input {
            width: 100%;
            padding: 18px 20px;
            border: 2px solid var(--gray-200);
            border-radius: 14px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: var(--bg-primary);
            position: relative;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
            transform: translateY(-1px);
        }

        .form-input::placeholder {
            color: var(--gray-400);
            transition: color 0.3s ease;
        }

        .form-input:focus::placeholder {
            color: var(--gray-500);
        }

        .form-input.error {
            border-color: var(--error);
            box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.1);
        }

        .form-input.success {
            border-color: var(--success);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
        }

        .input-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-400);
            transition: color 0.3s ease;
        }

        .form-input:focus + .input-icon {
            color: var(--primary);
        }

        .form-input.error + .input-icon {
            color: var(--error);
        }

        .form-input.success + .input-icon {
            color: var(--success);
        }

        .password-strength {
            margin-top: 8px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .strength-weak { color: var(--error); }
        .strength-medium { color: var(--warning); }
        .strength-strong { color: var(--success); }

        .strength-bar {
            display: flex;
            gap: 4px;
            margin-left: 8px;
        }

        .strength-bar-item {
            width: 20px;
            height: 4px;
            border-radius: 2px;
            background: var(--gray-200);
            transition: background 0.3s ease;
        }

        .strength-bar-item.active {
            background: currentColor;
        }

        .validation-message {
            margin-top: 6px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
            opacity: 0;
            transform: translateY(-5px);
            transition: all 0.3s ease;
        }

        .validation-message.show {
            opacity: 1;
            transform: translateY(0);
        }

        .validation-message.error {
            color: var(--error);
        }

        .validation-message.success {
            color: var(--success);
        }

        .validation-message i {
            font-size: 0.7rem;
        }

        .signup-btn {
            width: 100%;
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 24px;
            position: relative;
            overflow: hidden;
        }

        .signup-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .signup-btn:hover::before {
            left: 100%;
        }

        .signup-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(37, 99, 235, 0.4);
        }

        .signup-btn:active {
            transform: translateY(0);
        }

        .signup-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .signup-btn:disabled::before {
            display: none;
        }

        .divider {
            text-align: center;
            margin: 32px 0;
            position: relative;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--gray-200);
        }

        .divider span {
            background: white;
            padding: 0 20px;
            color: var(--gray-500);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .login-link {
            text-align: center;
            margin-top: 32px;
        }

        .login-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            position: relative;
        }

        .login-link a::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary);
            transition: width 0.3s ease;
        }

        .login-link a:hover::after {
            width: 100%;
        }

        .back-btn {
            position: absolute;
            top: 24px;
            left: 24px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3;
            backdrop-filter: blur(10px);
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .error-message {
            background: #fef2f2;
            color: var(--error);
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 24px;
            font-size: 0.9rem;
            border: 1px solid #fecaca;
            display: none;
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .success-message {
            background: #f0fdf4;
            color: var(--success);
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 24px;
            font-size: 0.9rem;
            border: 1px solid #bbf7d0;
            display: none;
            animation: slideDown 0.5s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .terms-checkbox {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 24px;
            padding: 20px;
            background: var(--bg-secondary);
            border-radius: 12px;
            border: 2px solid var(--gray-200);
            transition: all 0.3s ease;
        }

        .terms-checkbox:hover {
            border-color: var(--primary);
            background: rgba(37, 99, 235, 0.02);
        }

        .terms-checkbox input[type="checkbox"] {
            margin-top: 2px;
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
        }

        .terms-checkbox label {
            font-size: 0.9rem;
            color: var(--gray-600);
            line-height: 1.5;
            cursor: pointer;
        }

        .terms-checkbox a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .terms-checkbox a:hover {
            text-decoration: underline;
        }

        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .progress-indicator {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 32px;
        }

        .progress-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--gray-300);
            transition: all 0.3s ease;
        }

        .progress-dot.active {
            background: var(--primary);
            transform: scale(1.2);
        }

        .progress-dot.completed {
            background: var(--success);
        }

        /* 모바일 최적화 */
        @media (max-width: 480px) {
            .auth-container {
                margin: 0;
                border-radius: 0;
                min-height: 100vh;
                max-width: 100%;
            }
            
            .auth-header {
                padding: 40px 24px;
            }
            
            .auth-form {
                padding: 40px 24px;
            }

            .auth-title {
                font-size: 1.75rem;
            }

            .form-input {
                padding: 16px 18px;
            }
        }

        /* 접근성 개선 */
        .form-input:focus,
        .signup-btn:focus,
        .back-btn:focus {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        /* 다크모드 지원 */
        @media (prefers-color-scheme: dark) {
            .auth-container {
                background: var(--gray-900);
                color: white;
            }

            .form-input {
                background: var(--gray-800);
                border-color: var(--gray-700);
                color: white;
            }

            .form-input::placeholder {
                color: var(--gray-400);
            }

            .terms-checkbox {
                background: var(--gray-800);
                border-color: var(--gray-700);
            }

            .divider span {
                background: var(--gray-900);
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <button class="back-btn" onclick="goToHome()" aria-label="홈으로 돌아가기">
            <i class="fas fa-arrow-left"></i>
        </button>
        
        <div class="auth-header">
            <div class="auth-logo">
                <img src="/images/img/logo4.png" alt="AI 상담 시스템">
                <img src="/images/img/logo.png" alt="AI 멀티에이전트 상담" style="height: 40px;">
            </div>
            <h1 class="auth-title">회원가입</h1>
            <p class="auth-subtitle">AI 멀티에이전트 상담 시스템에 가입하세요</p>
        </div>

        <div class="auth-form">
            <div class="progress-indicator">
                <div class="progress-dot active"></div>
                <div class="progress-dot"></div>
                <div class="progress-dot"></div>
                <div class="progress-dot"></div>
            </div>

            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>
            
            <form id="signupForm" novalidate>
                <div class="form-group">
                    <label for="name" class="form-label">이름</label>
                    <input type="text" id="name" name="name" class="form-input" placeholder="이름을 입력하세요" required autocomplete="name">
                    <i class="fas fa-user input-icon"></i>
                    <div class="validation-message" id="nameValidation"></div>
                </div>
                
                <div class="form-group">
                    <label for="email" class="form-label">이메일</label>
                    <input type="email" id="email" name="email" class="form-input" placeholder="이메일을 입력하세요" required autocomplete="email">
                    <i class="fas fa-envelope input-icon"></i>
                    <div class="validation-message" id="emailValidation"></div>
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">비밀번호</label>
                    <input type="password" id="password" name="password" class="form-input" placeholder="비밀번호를 입력하세요" required autocomplete="new-password">
                    <i class="fas fa-lock input-icon"></i>
                    <div class="password-strength" id="passwordStrength">
                        <span class="strength-text">비밀번호 강도</span>
                        <div class="strength-bar">
                            <div class="strength-bar-item"></div>
                            <div class="strength-bar-item"></div>
                            <div class="strength-bar-item"></div>
                            <div class="strength-bar-item"></div>
                        </div>
                    </div>
                    <div class="validation-message" id="passwordValidation"></div>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword" class="form-label">비밀번호 확인</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" class="form-input" placeholder="비밀번호를 다시 입력하세요" required autocomplete="new-password">
                    <i class="fas fa-lock input-icon"></i>
                    <div class="validation-message" id="confirmPasswordValidation"></div>
                </div>
                
                <div class="terms-checkbox">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">
                        <a href="#" onclick="showTerms()">이용약관</a> 및 <a href="#" onclick="showPrivacy()">개인정보처리방침</a>에 동의합니다.
                    </label>
                </div>
                
                <button type="submit" class="signup-btn" id="signupBtn">
                    <span class="btn-text">
                    <i class="fas fa-user-plus"></i>
                    회원가입
                    </span>
                    <div class="loading-spinner"></div>
                </button>
            </form>
            
            <div class="divider">
                <span>또는</span>
            </div>
            
            <div class="login-link">
                <p>이미 계정이 있으신가요? <a href="/login">로그인</a></p>
            </div>
        </div>
    </div>

    <script>
        // 전역 변수
        let isSubmitting = false;
        let validationTimeout = {};

        // DOM 로드 완료 시 초기화
        document.addEventListener('DOMContentLoaded', function() {
            initializeForm();
            setupEventListeners();
        });

        // 폼 초기화
        function initializeForm() {
            const form = document.getElementById('signupForm');
            const inputs = form.querySelectorAll('input');
            
            inputs.forEach(input => {
                // 입력 시 실시간 유효성 검사
                input.addEventListener('input', function() {
                    clearTimeout(validationTimeout[this.id]);
                    validationTimeout[this.id] = setTimeout(() => {
                        validateField(this);
                    }, 300);
                });

                // 포커스 아웃 시 유효성 검사
                input.addEventListener('blur', function() {
                    validateField(this);
                });
            });
        }

        // 이벤트 리스너 설정
        function setupEventListeners() {
            const form = document.getElementById('signupForm');
            const signupBtn = document.getElementById('signupBtn');

            // 폼 제출
            form.addEventListener('submit', handleSubmit);

            // Enter 키로 폼 제출
            document.addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && !isSubmitting) {
                    form.dispatchEvent(new Event('submit'));
                }
            });

            // 비밀번호 강도 체크
            document.getElementById('password').addEventListener('input', function(e) {
                checkPasswordStrength(e.target.value);
            });

            // 비밀번호 확인 체크
            document.getElementById('confirmPassword').addEventListener('input', function(e) {
                checkPasswordMatch();
            });
        }

        // 필드 유효성 검사
        function validateField(field) {
            const value = field.value.trim();
            const fieldName = field.name;
            const validationDiv = document.getElementById(fieldName + 'Validation');
            
            let isValid = true;
            let message = '';

            switch(fieldName) {
                case 'name':
                    if (value.length < 2) {
                        isValid = false;
                        message = '이름은 최소 2자 이상이어야 합니다.';
                    } else if (!/^[가-힣a-zA-Z\s]+$/.test(value)) {
                        isValid = false;
                        message = '이름은 한글, 영문만 입력 가능합니다.';
                    } else {
                        message = '✓ 올바른 이름 형식입니다.';
                    }
                    break;

                case 'email':
                    if (!value) {
                        isValid = false;
                        message = '이메일을 입력해주세요.';
                    } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) {
                        isValid = false;
                        message = '올바른 이메일 형식을 입력해주세요.';
                    } else {
                        message = '✓ 올바른 이메일 형식입니다.';
                    }
                    break;

                case 'password':
                    if (value.length < 8) {
                        isValid = false;
                        message = '비밀번호는 최소 8자 이상이어야 합니다.';
                    } else if (!/(?=.*[a-zA-Z])(?=.*\d)/.test(value)) {
                        isValid = false;
                        message = '영문과 숫자를 포함해야 합니다.';
                    } else {
                        message = '✓ 안전한 비밀번호입니다.';
                    }
                    break;

                case 'confirmPassword':
                    const password = document.getElementById('password').value;
                    if (value && value !== password) {
                        isValid = false;
                        message = '비밀번호가 일치하지 않습니다.';
                    } else if (value && value === password) {
                        message = '✓ 비밀번호가 일치합니다.';
                    }
                    break;
            }

            // 시각적 피드백
            field.classList.remove('error', 'success');
            if (value) {
                field.classList.add(isValid ? 'success' : 'error');
            }

            // 메시지 표시
            showValidationMessage(validationDiv, message, isValid);
            
            return isValid;
        }

        // 유효성 검사 메시지 표시
        function showValidationMessage(element, message, isValid) {
            element.className = `validation-message ${isValid ? 'success' : 'error'} show`;
            element.textContent = message;
        }

        // 비밀번호 강도 체크
        function checkPasswordStrength(password) {
            const strengthDiv = document.getElementById('passwordStrength');
            const strengthText = strengthDiv.querySelector('.strength-text');
            const strengthBars = strengthDiv.querySelectorAll('.strength-bar-item');
            
            if (password.length === 0) {
                strengthText.textContent = '비밀번호 강도';
                strengthBars.forEach(bar => bar.classList.remove('active'));
                return;
            }
            
            let strength = 0;
            if (password.length >= 8) strength++;
            if (/[a-z]/.test(password)) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;
            
            // 강도 바 업데이트
            strengthBars.forEach((bar, index) => {
                bar.classList.remove('active');
                if (index < strength) {
                    bar.classList.add('active');
                }
            });
            
            // 텍스트 업데이트
            if (strength < 2) {
                strengthText.textContent = '약함';
                strengthDiv.className = 'password-strength strength-weak';
            } else if (strength < 4) {
                strengthText.textContent = '보통';
                strengthDiv.className = 'password-strength strength-medium';
            } else {
                strengthText.textContent = '강함';
                strengthDiv.className = 'password-strength strength-strong';
            }
        }

        // 비밀번호 일치 확인
        function checkPasswordMatch() {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const confirmField = document.getElementById('confirmPassword');
            
            if (confirmPassword && password !== confirmPassword) {
                confirmField.classList.add('error');
                confirmField.classList.remove('success');
            } else if (confirmPassword && password === confirmPassword) {
                confirmField.classList.add('success');
                confirmField.classList.remove('error');
            } else {
                confirmField.classList.remove('error', 'success');
            }
        }

        // 폼 제출 처리
        async function handleSubmit(e) {
            e.preventDefault();
            
            if (isSubmitting) return;
            
            const form = document.getElementById('signupForm');
            const signupBtn = document.getElementById('signupBtn');
            const btnText = signupBtn.querySelector('.btn-text');
            const loadingSpinner = signupBtn.querySelector('.loading-spinner');
            
            // 모든 필드 유효성 검사
            const name = document.getElementById('name');
            const email = document.getElementById('email');
            const password = document.getElementById('password');
            const confirmPassword = document.getElementById('confirmPassword');
            const terms = document.getElementById('terms');
            
            const isNameValid = validateField(name);
            const isEmailValid = validateField(email);
            const isPasswordValid = validateField(password);
            const isConfirmValid = validateField(confirmPassword);
            
            if (!isNameValid || !isEmailValid || !isPasswordValid || !isConfirmValid) {
                showError('모든 필드를 올바르게 입력해주세요.');
                return;
            }
            
            if (password.value !== confirmPassword.value) {
                showError('비밀번호가 일치하지 않습니다.');
                return;
            }
            
            if (!terms.checked) {
                showError('이용약관에 동의해주세요.');
                return;
            }
            
            // 제출 상태로 변경
            isSubmitting = true;
            signupBtn.disabled = true;
            btnText.style.display = 'none';
            loadingSpinner.style.display = 'block';
            
            try {
                const response = await fetch('/api/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        name: name.value.trim(),
                        email: email.value.trim().toLowerCase(),
                        password: password.value
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showSuccess('회원가입이 완료되었습니다! 로그인 페이지로 이동합니다.');
                    updateProgress(4);
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 2000);
                } else {
                    showError(data.message || '회원가입에 실패했습니다.');
                }
            } catch (error) {
                showError('네트워크 오류가 발생했습니다.');
            } finally {
                // 버튼 상태 복원
                isSubmitting = false;
                signupBtn.disabled = false;
                btnText.style.display = 'block';
                loadingSpinner.style.display = 'none';
            }
        }

        // 진행 표시 업데이트
        function updateProgress(step) {
            const dots = document.querySelectorAll('.progress-dot');
            dots.forEach((dot, index) => {
                if (index < step) {
                    dot.classList.add('completed');
                } else if (index === step - 1) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active', 'completed');
                }
            });
        }

        // 에러 메시지 표시
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            successDiv.style.display = 'none';
            
            // 자동 숨김
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        // 성공 메시지 표시
        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            const errorDiv = document.getElementById('errorMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            errorDiv.style.display = 'none';
        }

        // 메시지 숨김
        function hideMessages() {
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('successMessage').style.display = 'none';
        }

        // 약관 표시
        function showTerms() {
            alert('이용약관\n\n1. 서비스 이용 시 관련 법규를 준수해야 합니다.\n2. 개인정보는 상담 목적으로만 사용됩니다.\n3. 부적절한 내용은 제재받을 수 있습니다.\n4. 서비스 이용 중 발생하는 문제에 대해 책임을 지지 않습니다.');
        }

        function showPrivacy() {
            alert('개인정보처리방침\n\n1. 수집된 개인정보는 상담 서비스 제공 목적으로만 사용됩니다.\n2. 개인정보는 암호화되어 안전하게 보관됩니다.\n3. 개인정보는 법적 요구사항에 따라 보관됩니다.\n4. 개인정보는 제3자에게 제공되지 않습니다.');
        }

        // 홈으로 이동
        function goToHome() {
            window.location.href = '/';
        }

        // 키보드 접근성 개선
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                goToHome();
            }
        });
    </script>
</body>
